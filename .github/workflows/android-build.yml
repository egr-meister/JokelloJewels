name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Signed APK + AAB
    # Pinned image: ubuntu-latest is migrating to Ubuntu 26 (Oct 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper (if committed)
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; use its own sdkmanager directly
      # (android-actions/setup-android@v3 fails trying to install the removed 'tools' package).
      - name: Install SDK Platform 36 + Build Tools 36.0.0
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;${BUILD_TOOLS}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          KS_PATH="$RUNNER_TEMP/release-keystore.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
          if [ ! -s "$KS_PATH" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build signed release APK + AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature (fail on debug certificate)
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          if ! "$BT/apksigner" verify --verbose --print-certs "$APK" > apksigner.txt 2>&1; then
            cat apksigner.txt
            echo "::error::apksigner verification failed."
            exit 1
          fi
          cat apksigner.txt
          if grep -qi "CN=Android Debug" apksigner.txt; then
            echo "::error::APK is signed with the Android DEBUG certificate."
            exit 1
          fi

      - name: Verify AAB signature (fail on debug certificate)
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "AAB: $AAB"
          jarsigner -verify -verbose:summary -certs "$AAB" > jarsigner.txt 2>&1 || true
          if ! grep -q "jar verified" jarsigner.txt; then
            tail -n 40 jarsigner.txt
            echo "::error::AAB signature verification failed."
            exit 1
          fi
          if grep -qi "CN=Android Debug" jarsigner.txt; then
            echo "::error::AAB is signed with the Android DEBUG certificate."
            exit 1
          fi
          echo "AAB signature OK."

      - name: Check 16 KB page alignment (APK)
        run: |
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -n 3

      - name: Upload APK (test artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jokello-jewels-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB (Google Play artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jokello-jewels-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.p12"
